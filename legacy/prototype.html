<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243b">
  <title>Анонимный Дед Мороз — расширенный 3D-прототип</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      --panel: rgba(12, 30, 51, .88);
      --line: rgba(206, 231, 255, .24);
      --text: #f5f9ff;
      --muted: #bdd1e5;
      --gold: #ffd987;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #10243b;
      color: var(--text);
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .2);
      backdrop-filter: blur(12px);
    }

    #top {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    #top > * {
      pointer-events: auto;
    }

    #info {
      width: min(440px, calc(100vw - 28px));
      padding: 14px 16px;
    }

    #info h1 {
      margin: 0 0 4px;
      font-size: clamp(19px, 2.2vw, 26px);
    }

    #locationName {
      color: var(--gold);
      font-weight: 750;
    }

    #objective {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.4;
      font-size: 13px;
    }

    #stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .stat {
      padding: 5px 8px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .09);
      font-size: 12px;
    }

    #rightColumn {
      display: grid;
      justify-items: end;
      gap: 8px;
    }

    #help {
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.55;
    }

    #helpButtons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .smallButton {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
      color: var(--text);
    }

    .smallButton:hover {
      background: rgba(255, 255, 255, .17);
    }

    #mapPanel {
      width: 178px;
      padding: 8px;
    }

    #mapPanel strong {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    #minimap {
      display: block;
      width: 160px;
      height: 160px;
      border-radius: 8px;
      background: #1a3547;
    }

    #bottom {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      width: min(570px, calc(100vw - 20px));
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #prompt {
      min-height: 35px;
      max-width: 100%;
      padding: 8px 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 750;
    }

    #prompt:empty {
      visibility: hidden;
    }

    #inventory {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      padding: 9px;
    }

    .slot {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 73px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 3px;
      padding: 7px 4px;
      border: 2px solid transparent;
      border-radius: 11px;
      background: rgba(255, 255, 255, .08);
      color: var(--text);
    }

    .slot:hover {
      background: rgba(255, 255, 255, .15);
    }

    .slot.selected {
      border-color: var(--gold);
      background: rgba(255, 217, 135, .18);
      box-shadow: 0 0 14px rgba(255, 217, 135, .18);
    }

    .slot .num {
      position: absolute;
      top: 4px;
      left: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .slot .icon {
      font-size: 23px;
      line-height: 1;
    }

    .slot .name {
      overflow: hidden;
      width: 100%;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    #toast {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      max-width: min(480px, calc(100vw - 28px));
      padding: 10px 15px;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    }

    #toast.visible {
      opacity: 1;
    }

    #overlay[hidden] {
      display: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(5, 13, 28, .7);
    }

    #dialog {
      position: relative;
      width: min(520px, 100%);
      padding: 25px;
      border: 1px solid rgba(255, 225, 166, .4);
      border-radius: 20px;
      background: #152b44;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .4);
    }

    #dialog h2 {
      margin: 0 36px 12px 0;
      color: var(--gold);
    }

    #dialogText {
      margin: 0;
      line-height: 1.6;
      white-space: pre-line;
    }

    #dialogButtons {
      display: grid;
      gap: 8px;
      margin-top: 22px;
    }

    #dialogButtons button {
      padding: 11px 13px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 10px;
      background: rgba(255, 255, 255, .09);
      color: #fff;
      text-align: left;
    }

    #dialogButtons button:hover {
      background: rgba(255, 217, 135, .2);
    }

    #closeDialog {
      position: absolute;
      top: 14px;
      right: 15px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .12);
      color: white;
      font-size: 21px;
    }

    @media (max-width: 700px) {
      #top {
        display: block;
      }

      #info {
        padding: 10px 12px;
      }

      #info h1 {
        font-size: 18px;
      }

      #objective {
        font-size: 11px;
      }

      #rightColumn {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 7px;
        margin-top: 6px;
      }

      #help {
        padding: 7px 9px;
        font-size: 10px;
      }

      #mapPanel {
        width: 102px;
        padding: 5px;
      }

      #minimap {
        width: 90px;
        height: 90px;
      }

      .slot {
        min-height: 62px;
      }

      .slot .icon {
        font-size: 19px;
      }

      .slot .name {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <main id="scene" aria-label="Трёхмерная игровая сцена"></main>

  <header id="top">
    <section id="info" class="panel">
      <h1>Анонимный Дед Мороз</h1>
      <div id="locationName"></div>
      <p id="objective"></p>
      <div id="stats" aria-label="Параметры персонажа"></div>
    </section>

    <div id="rightColumn">
      <aside id="help" class="panel">
        <strong>Управление</strong><br>
        WASD — идти · E — взаимодействовать<br>
        1–4 — выбрать предмет · F — использовать<br>
        Esc — закрыть диалог
        <div id="helpButtons">
          <button id="musicButton" class="smallButton" type="button"
                  aria-pressed="false">♫ Включить эмбиент</button>
          <button id="reset" class="smallButton" type="button">
            Начать заново
          </button>
        </div>
      </aside>

      <section id="mapPanel" class="panel" aria-label="Мини-карта">
        <strong>Карта · жёлтый — игрок</strong>
        <canvas id="minimap" width="160" height="160"></canvas>
      </section>
    </div>
  </header>

  <div id="toast" class="panel" role="status" aria-live="polite"></div>

  <footer id="bottom">
    <div id="prompt" class="panel" aria-live="polite"></div>
    <nav id="inventory" class="panel" aria-label="Инвентарь"></nav>
  </footer>

  <div id="overlay" hidden>
    <section id="dialog" role="dialog" aria-modal="true"
             aria-labelledby="dialogTitle" aria-describedby="dialogText">
      <button id="closeDialog" type="button" aria-label="Закрыть">×</button>
      <h2 id="dialogTitle"></h2>
      <p id="dialogText"></p>
      <div id="dialogButtons"></div>
    </section>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

    /*
     * Локальные координаты локации: X/Z от -22 до +22.
     * Каждая локация расположена в отдельной области мировой сцены.
     * Геометрия, коллизии, взаимодействия и мини-карта используют
     * одни и те же локальные координаты.
     */

    // ================================================================
    // 1. ДАННЫЕ И СОХРАНЕНИЕ
    // ================================================================

    const $ = id => document.getElementById(id);

    const SAVE_KEY = "anonymous-santa-three-v2";
    const HALF_WORLD = 22;
    const PLAYER_RADIUS = 0.39;
    const PLAYER_SPEED = 4.8;

    const LOCATIONS = {
      square: {
        name: "Снежная площадь",
        baseX: 0,
        sky: 0x9fc1dc
      },
      workshop: {
        name: "Мастерская",
        baseX: 70,
        sky: 0x8ca9b9
      },
      forest: {
        name: "Волшебный лес",
        baseX: 140,
        sky: 0x789eb5
      }
    };

    const ITEMS = {
      gift:        { icon: "🎁", name: "Подарок" },
      cookie:      { icon: "🍪", name: "Печенье" },
      ribbon:      { icon: "🎀", name: "Лента" },
      wrappedGift: { icon: "🎁", name: "Упакованный подарок" },
      lantern:     { icon: "🏮", name: "Фонарь" },
      star:        { icon: "⭐", name: "Звезда" }
    };

    const ITEM_IDS = Object.keys(ITEMS);

    function freshState() {
      return {
        version: 2,
        locationId: "square",
        player: { x: 0, z: 12 },
        inventory: ["gift", "cookie", null, null],
        selectedSlot: 0,
        stats: {
          kindness: 0,
          anonymity: 1,
          warmth: 0
        },
        flags: {
          ribbonTaken: false,
          giftDelivered: false,
          foxTradeDone: false,
          treeLit: false,
          completed: false
        }
      };
    }

    function inRange(value, min, max) {
      return Number.isFinite(value) && value >= min && value <= max;
    }

    function loadState() {
      try {
        const data = JSON.parse(localStorage.getItem(SAVE_KEY));

        if (!data ||
            data.version !== 2 ||
            !LOCATIONS[data.locationId] ||
            !data.player ||
            !inRange(data.player.x, -21, 21) ||
            !inRange(data.player.z, -21, 21) ||
            !Array.isArray(data.inventory) ||
            data.inventory.length !== 4 ||
            !data.inventory.every(id =>
              id === null || ITEM_IDS.includes(id)
            ) ||
            !Number.isInteger(data.selectedSlot) ||
            data.selectedSlot < 0 ||
            data.selectedSlot > 3) {
          return freshState();
        }

        const s = data.stats;
        const f = data.flags;

        if (!s || !f ||
            !inRange(s.kindness, 0, 100) ||
            !inRange(s.anonymity, 0, 100) ||
            !inRange(s.warmth, 0, 100) ||
            !["ribbonTaken", "giftDelivered", "foxTradeDone",
               "treeLit", "completed"].every(key =>
              typeof f[key] === "boolean"
            )) {
          return freshState();
        }

        return data;
      } catch {
        return freshState();
      }
    }

    let state = loadState();

    function save() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      } catch {
        // Отказ localStorage не должен останавливать игру.
      }
    }

    function changed() {
      save();
      updateHud();
    }

    function hasItem(id) {
      return state.inventory.includes(id);
    }

    function addItem(id) {
      const index = state.inventory.indexOf(null);
      if (index < 0) return false;

      state.inventory[index] = id;
      changed();
      return true;
    }

    function removeItem(id) {
      const index = state.inventory.indexOf(id);
      if (index < 0) return false;

      state.inventory[index] = null;
      changed();
      return true;
    }

    // ================================================================
    // 2. UI
    // ================================================================

    const overlay = $("overlay");
    const prompt = $("prompt");
    const inventoryEl = $("inventory");

    let toastTimer = 0;
    let talkingNpcId = null;

    function toast(message) {
      $("toast").textContent = message;
      $("toast").classList.add("visible");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        $("toast").classList.remove("visible");
      }, 3000);
    }

    function objectiveText() {
      if (state.flags.completed) {
        return "История завершена. Можно исследовать мир или начать заново.";
      }

      if (!state.flags.giftDelivered) {
        if (!hasItem("wrappedGift")) {
          return "На большой площади найдите портал в Мастерскую, возьмите ленту у Эльфа и упакуйте подарок.";
        }

        return "Вернитесь на площадь и вручите упакованный подарок Бабушке.";
      }

      if (!state.flags.treeLit) {
        return "В Лесу обменяйте печенье на фонарь и зажгите праздничную ёлку.";
      }

      return "Вернитесь на площадь и откройте почтовый ящик.";
    }

    function updateHud() {
      $("locationName").textContent = LOCATIONS[state.locationId].name;
      $("objective").textContent = objectiveText();

      const stats = $("stats");
      stats.replaceChildren();

      [
        `❤️ Доброта: ${state.stats.kindness}`,
        `🎭 Анонимность: ${state.stats.anonymity}`,
        `✨ Тепло: ${state.stats.warmth}`
      ].forEach(text => {
        const element = document.createElement("span");
        element.className = "stat";
        element.textContent = text;
        stats.append(element);
      });

      inventoryEl.replaceChildren();

      state.inventory.forEach((id, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          `slot${state.selectedSlot === index ? " selected" : ""}`;

        button.setAttribute(
          "aria-label",
          `Ячейка ${index + 1}: ${id ? ITEMS[id].name : "пусто"}`
        );

        button.setAttribute(
          "aria-pressed",
          String(state.selectedSlot === index)
        );

        const number = document.createElement("span");
        number.className = "num";
        number.textContent = String(index + 1);

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = id ? ITEMS[id].icon : "·";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = id ? ITEMS[id].name : "Пусто";

        button.append(number, icon, name);

        button.addEventListener("click", () => {
          if (!overlay.hidden) return;

          state.selectedSlot = index;
          changed();
        });

        inventoryEl.append(button);
      });
    }

    function closeModal() {
      overlay.hidden = true;
      talkingNpcId = null;
      $("dialogButtons").replaceChildren();
    }

    function showModal(title, text, actions = [], npcId = null) {
      overlay.hidden = false;
      talkingNpcId = npcId;

      $("dialogTitle").textContent = title;
      $("dialogText").textContent = text;

      const buttons = $("dialogButtons");
      buttons.replaceChildren();

      const variants = actions.length
        ? actions
        : [{ label: "Понятно", run: closeModal }];

      for (const action of variants) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = action.label;

        button.addEventListener("click", action.run);

        buttons.append(button);
      }

      buttons.querySelector("button")?.focus();
    }

    $("closeDialog").addEventListener("click", closeModal);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeModal();
    });

    $("reset").addEventListener("click", () => {
      showModal(
        "Начать заново?",
        "Сохранённый прогресс этого прохождения будет удалён.",
        [
          {
            label: "Да, начать заново",
            run: () => {
              localStorage.removeItem(SAVE_KEY);
              location.reload();
            }
          },
          { label: "Отмена", run: closeModal }
        ]
      );
    });

    // ================================================================
    // 3. THREE.JS: СЦЕНА И МАТЕРИАЛЫ
    // ================================================================

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(LOCATIONS[state.locationId].sky);

    scene.fog = new THREE.Fog(
      LOCATIONS[state.locationId].sky,
      28,
      78
    );

    const camera = new THREE.PerspectiveCamera(
      48,
      innerWidth / innerHeight,
      0.1,
      180
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.45;

    $("scene").append(renderer.domElement);

    scene.add(
      new THREE.HemisphereLight(0xcce8ff, 0x637b94, 2.1)
    );

    const sun = new THREE.DirectionalLight(0xffeed2, 2.6);

    sun.position.set(8, 17, 11);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);

    sun.shadow.camera.left = -25;
    sun.shadow.camera.right = 25;
    sun.shadow.camera.top = 25;
    sun.shadow.camera.bottom = -25;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 70;
    sun.shadow.normalBias = 0.04;

    scene.add(sun, sun.target);

    const material = (color, extra = {}) =>
      new THREE.MeshStandardMaterial({
        color,
        flatShading: true,
        roughness: 0.84,
        ...extra
      });

    const MAT = {
      snow: material(0xe9f5fa),
      snowShade: material(0xd5e8f0),
      white: material(0xffffff),
      red: material(0xba3240),
      darkRed: material(0x782533),
      skin: material(0xf4c5a3),
      coal: material(0x263345),
      gold: material(0xffd27d),
      green: material(0x347862),
      darkGreen: material(0x235b55),
      brown: material(0x806044),
      wood: material(0x9a704e),
      blue: material(0x5995b0),
      purple: material(0x806394),
      orange: material(0xdd874c),
      stone: material(0x8295a4),
      stoneDark: material(0x647b8b),
      workshopFloor: material(0xa58160),
      glow: material(0xffde89, {
        emissive: 0xffbd54,
        emissiveIntensity: 1.1
      })
    };

    function part(parent, geometry, mat, x, y, z) {
      const mesh = new THREE.Mesh(geometry, mat);

      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      parent.add(mesh);

      return mesh;
    }

    function box(parent, sizes, mat, x, y, z) {
      return part(
        parent,
        new THREE.BoxGeometry(...sizes),
        mat,
        x,
        y,
        z
      );
    }

    function sphere(parent, radius, mat, x, y, z, detail = 1) {
      return part(
        parent,
        new THREE.IcosahedronGeometry(radius, detail),
        mat,
        x,
        y,
        z
      );
    }

    function cylinder(
      parent,
      top,
      bottom,
      height,
      mat,
      x,
      y,
      z,
      sides = 8
    ) {
      return part(
        parent,
        new THREE.CylinderGeometry(
          top, bottom, height, sides
        ),
        mat,
        x,
        y,
        z
      );
    }

    function cone(
      parent,
      radius,
      height,
      mat,
      x,
      y,
      z,
      sides = 7
    ) {
      return part(
        parent,
        new THREE.ConeGeometry(radius, height, sides),
        mat,
        x,
        y,
        z
      );
    }

    // Детерминированное размещение окружения: после перезагрузки
    // препятствия остаются на тех же местах.
    function randomGenerator(seed) {
      let value = seed >>> 0;

      return () => {
        value =
          (Math.imul(value, 1664525) + 1013904223) >>> 0;

        return value / 4294967296;
      };
    }

    const random = randomGenerator(871224);

    // ================================================================
    // 4. ВЫСОТА ПОВЕРХНОСТИ
    // ================================================================

    function smoothstep(a, b, value) {
      const t = THREE.MathUtils.clamp(
        (value - a) / (b - a),
        0,
        1
      );

      return t * t * (3 - 2 * t);
    }

    function hill(x, z, centerX, centerZ, height, radius) {
      const dx = x - centerX;
      const dz = z - centerZ;

      return height *
        Math.exp(-(dx * dx + dz * dz) / (radius * radius));
    }

    function terrainHeight(locationId, x, z) {
      if (locationId === "square") {
        return hill(x, z, 11, 11, 1.35, 9);
      }

      if (locationId === "forest") {
        return (
          hill(x, z, 10, 8, 2.8, 9) +
          hill(x, z, -9, 10, 1.5, 7)
        );
      }

      return 0;
    }

    /*
     * Мастерская: 6 ступеней по 0,25. Верхняя площадка высотой 1,5.
     * Ступени являются ПРОХОДИМОЙ поверхностью, а не обычными
     * непроходимыми препятствиями.
     */
    function surfaceHeight(locationId, x, z) {
      if (locationId !== "workshop") {
        return terrainHeight(locationId, x, z);
      }

      if (x >= 9 && x <= 13 && z >= 0 && z < 6) {
        const step = Math.floor(z);

        return (step + 1) * 0.25;
      }

      if (x >= 7 && x <= 15 && z >= 6 && z <= 15) {
        return 1.5;
      }

      return 0;
    }

    // ================================================================
    // 5. КОЛЛИЗИИ
    // ================================================================

    /*
     * Используем круг персонажа в плоскости XZ и набор коллайдеров:
     *
     * circle: стволы, камни, NPC, цилиндрические опоры;
     * box: здания, мебель, перила, ящики;
     *
     * У каждого статического коллайдера есть вертикальный интервал.
     * Поэтому игрок на верхней площадке не сталкивается с предметом,
     * расположенным существенно ниже.
     *
     * Геометрия снежных склонов — проходимая поверхность, а не
     * препятствие. Лестничные ступени — тоже проходимая поверхность.
     */

    const colliders = {
      square: [],
      workshop: [],
      forest: []
    };

    function circleCollider(
      locationId,
      x,
      z,
      radius,
      yMin,
      yMax,
      tag = "obstacle"
    ) {
      colliders[locationId].push({
        type: "circle",
        x,
        z,
        radius,
        yMin,
        yMax,
        tag
      });
    }

    function boxCollider(
      locationId,
      x,
      z,
      width,
      depth,
      yMin,
      yMax,
      tag = "obstacle"
    ) {
      colliders[locationId].push({
        type: "box",
        x,
        z,
        hx: width / 2,
        hz: depth / 2,
        yMin,
        yMax,
        tag
      });
    }

    function circleHitsCollider(x, z, radius, collider) {
      if (collider.type === "circle") {
        const dx = x - collider.x;
        const dz = z - collider.z;
        const total = radius + collider.radius;

        return dx * dx + dz * dz < total * total;
      }

      const closestX = THREE.MathUtils.clamp(
        x,
        collider.x - collider.hx,
        collider.x + collider.hx
      );

      const closestZ = THREE.MathUtils.clamp(
        z,
        collider.z - collider.hz,
        collider.z + collider.hz
      );

      const dx = x - closestX;
      const dz = z - closestZ;

      return dx * dx + dz * dz < radius * radius;
    }

    function hitsStatic(
      locationId,
      x,
      z,
      feetY,
      radius = PLAYER_RADIUS
    ) {
      for (const collider of colliders[locationId]) {
        const verticallyOverlaps =
          feetY + 2.45 > collider.yMin &&
          feetY + 0.08 < collider.yMax;

        if (!verticallyOverlaps) continue;

        if (circleHitsCollider(x, z, radius, collider)) {
          return true;
        }
      }

      return false;
    }

    // Функция будет заполнена после создания NPC.
    const npcs = [];

    function hitsNpc(
      locationId,
      x,
      z,
      feetY,
      ignoredNpcId = null
    ) {
      for (const npc of npcs) {
        if (npc.locationId !== locationId) continue;
        if (npc.id === ignoredNpcId) continue;

        const distance = Math.hypot(
          x - npc.x,
          z - npc.z
        );

        const npcFeet = surfaceHeight(
          locationId,
          npc.x,
          npc.z
        );

        if (
          distance < PLAYER_RADIUS + npc.radius &&
          Math.abs(feetY - npcFeet) < 1.5
        ) {
          return true;
        }
      }

      return false;
    }

    function validPlayerPosition(x, z, previousHeight) {
      if (
        x < -20.7 ||
        x > 20.7 ||
        z < -20.7 ||
        z > 20.7
      ) {
        return false;
      }

      const nextHeight = surfaceHeight(
        state.locationId,
        x,
        z
      );

      /*
       * Подъём максимум 0,29 за один небольшой шаг:
       * лестница высотой 0,25 проходится; через борт платформы
       * высотой 1,5 персонаж не перепрыгивает.
       */
      if (nextHeight - previousHeight > 0.29) {
        return false;
      }

      if (hitsStatic(
        state.locationId,
        x,
        z,
        nextHeight
      )) {
        return false;
      }

      if (hitsNpc(
        state.locationId,
        x,
        z,
        nextHeight
      )) {
        return false;
      }

      return true;
    }

    /*
     * Перемещение разбивается на короткие шаги.
     * Это предотвращает проход сквозь тонкие коллайдеры при просадке FPS.
     * Движение X/Z проверяется раздельно, поэтому игрок скользит
     * вдоль стены вместо полной остановки.
     */
    function movePlayer(dx, dz) {
      const steps = Math.max(
        1,
        Math.ceil(Math.hypot(dx, dz) / 0.12)
      );

      const stepX = dx / steps;
      const stepZ = dz / steps;

      for (let i = 0; i < steps; i++) {
        let currentHeight = surfaceHeight(
          state.locationId,
          state.player.x,
          state.player.z
        );

        const nextX = state.player.x + stepX;

        if (validPlayerPosition(
          nextX,
          state.player.z,
          currentHeight
        )) {
          state.player.x = nextX;
        }

        currentHeight = surfaceHeight(
          state.locationId,
          state.player.x,
          state.player.z
        );

        const nextZ = state.player.z + stepZ;

        if (validPlayerPosition(
          state.player.x,
          nextZ,
          currentHeight
        )) {
          state.player.z = nextZ;
        }
      }
    }

    // ================================================================
    // 6. ОБЪЕКТЫ ОКРУЖЕНИЯ
    // ================================================================

    const locationGroups = {};
    const animated = [];
    const particleSystems = [];
    const interactables = [];

    function makeTerrain(locationId) {
      const group = new THREE.Group();

      group.position.x = LOCATIONS[locationId].baseX;
      scene.add(group);

      locationGroups[locationId] = group;

      const geometry = new THREE.PlaneGeometry(
        HALF_WORLD * 2,
        HALF_WORLD * 2,
        88,
        88
      );

      geometry.rotateX(-Math.PI / 2);

      const positions = geometry.attributes.position;

      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const z = positions.getZ(i);

        positions.setY(
          i,
          terrainHeight(locationId, x, z)
        );
      }

      positions.needsUpdate = true;
      geometry.computeVertexNormals();

      const floor = new THREE.Mesh(
        geometry,
        locationId === "workshop"
          ? MAT.workshopFloor
          : MAT.snow
      );

      floor.receiveShadow = true;
      group.add(floor);

      return group;
    }

    function makeTree(parent, locationId, x, z, scale = 1) {
      const tree = new THREE.Group();

      tree.position.set(
        x,
        terrainHeight(locationId, x, z),
        z
      );

      tree.scale.setScalar(scale);
      parent.add(tree);

      cylinder(
        tree,
        0.17,
        0.22,
        1.1,
        MAT.brown,
        0,
        0.55,
        0
      );

      cone(
        tree,
        0.95,
        1.55,
        MAT.darkGreen,
        0,
        1.45,
        0
      );

      cone(
        tree,
        0.77,
        1.35,
        MAT.green,
        0,
        2.18,
        0
      );

      cone(
        tree,
        0.52,
        1.12,
        MAT.darkGreen,
        0,
        2.8,
        0
      );

      sphere(
        tree,
        0.095,
        MAT.white,
        0.39,
        1.85,
        0.3
      );

      const groundY = terrainHeight(
        locationId,
        x,
        z
      );

      circleCollider(
        locationId,
        x,
        z,
        0.44 * scale,
        groundY - 0.15,
        groundY + 3.8 * scale,
        "tree"
      );

      return tree;
    }

    function makeRock(
      parent,
      locationId,
      x,
      z,
      radius = 0.9
    ) {
      const y = terrainHeight(locationId, x, z);

      const mesh = sphere(
        parent,
        radius,
        random() > 0.5
          ? MAT.stone
          : MAT.stoneDark,
        x,
        y + radius * 0.45,
        z,
        0
      );

      mesh.scale.set(
        1,
        0.72 + random() * 0.3,
        0.75 + random() * 0.5
      );

      circleCollider(
        locationId,
        x,
        z,
        radius * 0.75,
        y - 0.1,
        y + radius * 1.5,
        "rock"
      );
    }

    function makeMountain(
      parent,
      locationId,
      x,
      z,
      radius = 2.5
    ) {
      const groundY = terrainHeight(
        locationId,
        x,
        z
      );

      const mountain = cone(
        parent,
        radius,
        radius * 2.1,
        MAT.stone,
        x,
        groundY + radius * 0.92,
        z,
        6
      );

      mountain.rotation.y = random() * 2;
      mountain.scale.x = 0.9 + random() * 0.25;
      mountain.scale.z = 0.85 + random() * 0.25;

      cone(
        parent,
        radius * 0.39,
        radius * 0.72,
        MAT.white,
        x,
        groundY + radius * 1.91,
        z,
        6
      );

      circleCollider(
        locationId,
        x,
        z,
        radius * 0.78,
        groundY - 0.3,
        groundY + radius * 2.3,
        "mountain"
      );
    }

    function makeGift(parent, x, y, z) {
      const group = new THREE.Group();

      group.position.set(x, y, z);
      parent.add(group);

      box(group, [0.8, 0.58, 0.8],
        MAT.red, 0, 0, 0);

      box(group, [0.13, 0.62, 0.82],
        MAT.gold, 0, 0.01, 0);

      box(group, [0.82, 0.62, 0.13],
        MAT.gold, 0, 0.01, 0);

      box(group, [0.9, 0.12, 0.9],
        MAT.darkRed, 0, 0.34, 0);

      return group;
    }

    function makePortal(
      parent,
      locationId,
      x,
      z,
      color
    ) {
      const groundY = terrainHeight(
        locationId,
        x,
        z
      );

      const group = new THREE.Group();

      group.position.set(x, groundY, z);
      parent.add(group);

      cylinder(
        group,
        0.85,
        0.95,
        0.27,
        MAT.wood,
        0,
        0.13,
        0
      );

      const ringMaterial = material(color, {
        emissive: color,
        emissiveIntensity: 0.65
      });

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
          1,
          0.16,
          7,
          14
        ),
        ringMaterial
      );

      ring.position.y = 1.55;
      group.add(ring);

      sphere(
        group,
        0.2,
        MAT.glow,
        0,
        1.55,
        0,
        0
      );

      /*
       * Коллайдер у постамента не даёт персонажу войти в его
       * геометрию. Для телепорта достаточно подойти рядом.
       */
      circleCollider(
        locationId,
        x,
        z,
        0.87,
        groundY - 0.1,
        groundY + 2.7,
        "portal"
      );

      animated.push({
        type: "portal",
        mesh: ring
      });
    }

    function makePersonMesh(

        box(

          -0.27,

        );

        legs.push(legPivot);
      }

      const body = new THREE.Group();
      root.add(body);

      cylinder(

      );

      sphere(

      );

      cone(

        0.37,

      );

      sphere(

      );

      sphere(

      sphere(

      for (const side of [-1, 1]) {

        box(

        );

        sphere(
          armPivot,
          0.13,
          MAT.white,
          side * 0.08,

        );

        arms.push(armPivot);
      }

      return { root, body, arms, legs };
    }

    function makeFoxMesh() {

    function addParticles(
      parent,
      locationId,
      type,
      count
    ) {
      const positions = new Float32Array(
        count * 3
      );

      const speeds = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        positions[i * 3] = random() * 42 - 21;
        positions[i * 3 + 1] = random() * 10 + 0.4;
        positions[i * 3 + 2] = random() * 42 - 21;
        speeds[i] = 0.45 + random() * 0.9;
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );

      const points = new THREE.Points(
        geometry,
        new THREE.PointsMaterial({
          color:
            type === "fireflies"
              ? 0xffe29b
              : 0xffffff,
          size:
            type === "fireflies"
              ? 0.16
              : 0.095,
          transparent: true,
          opacity:
            type === "fireflies"
              ? 0.85
              : 0.78,
          depthWrite: false
        })
      );

      parent.add(points);

      particleSystems.push({
        locationId,
        type,
        points,
        speeds
      });
    }

    function decorateBorders(
      parent,
      locationId,
      trees = true
    ) {
      /*
       * Визуальная граница из леса и скал.
       * Дополнительно координаты ограничены в validPlayerPosition:
       * между соседними объектами нельзя выйти за пределы мира.
       */

      for (let i = -19; i <= 19; i += 4.2) {
        for (const side of [-1, 1]) {
          const offset = (random() - 0.5) * 1.3;

          if (trees && random() > 0.35) {
            makeTree(
              parent,
              locationId,
              i + offset,
              side * 20,
              1.05 + random() * 0.45
            );
          } else {
            makeMountain(
              parent,
              locationId,
              i + offset,
              side * 20,
              1.6 + random() * 0.8
            );
          }

          if (trees && random() > 0.35) {
            makeTree(
              parent,
              locationId,
              side * 20,
              i + offset,
              1.05 + random() * 0.45
            );
          } else {
            makeMountain(
              parent,
              locationId,
              side * 20,
              i + offset,
              1.6 + random() * 0.8
            );
          }
        }
      }
    }

    // ---------------- ПЛОЩАДЬ ----------------

    const square = makeTerrain("square");

    decorateBorders(square, "square", true);

    [
      [-13, 6], [-10, 12], [13, -3], [16, 9],
      [-15, -11], [10, 15], [-7, 16]
    ].forEach(([x, z], index) => {
      makeTree(
        square,
        "square",
        x,
        z,
        0.9 + (index % 3) * 0.12
      );
    });

    [
      [15, 2, 2.5],
      [-13, -2, 2.2],
      [12, -15, 2.5]
    ].forEach(([x, z, radius]) => {
      makeMountain(
        square,
        "square",
        x,
        z,
        radius
      );
    });

    [
      [-8, 7, 0.95],
      [-13, 3, 0.75],
      [9, 12, 0.9]
    ].forEach(([x, z, radius]) => {
      makeRock(
        square,
        "square",
        x,
        z,
        radius
      );
    });

    // Дом: коробка и крыша. Стены имеют единый box collider.
    const houseX = -12;
    const houseZ = -11;
    const houseY = terrainHeight(
      "square",
      houseX,
      houseZ
    );

    box(
      square,
      [5.2, 3.7, 4.2],
      MAT.wood,
      houseX,
      houseY + 1.85,
      houseZ
    );

    const roof = cone(
      square,
      3.65,
      2.2,
      MAT.darkRed,
      houseX,

    function updateNpc(npc, dt, elapsed) {
      if (npc.locationId !== state.locationId) {
        return;
      }

      npc.animationTime += dt;

      if (
        !overlay.hidden &&
        talkingNpcId === npc.id
      ) {
        npc.mode = "talk";
      } else if (!overlay.hidden) {
        npc.mode = "idle";
      } else if (npc.pause > 0) {
        npc.pause -= dt;
        npc.mode = "idle";
      } else {
        const target = npc.route[
          npc.routeIndex
        ];

        const dx = target[0] - npc.x;
        const dz = target[1] - npc.z;
        const distance = Math.hypot(dx, dz);

        if (distance < 0.12) {
          npc.routeIndex =
            (npc.routeIndex + 1) %
            npc.route.length;

          npc.pause = 1.1 + random() * 0.8;
          npc.mode = "idle";
        } else {
          const length = Math.min(
            distance,
            0.85 * dt
          );

          const nextX =
            npc.x + dx / distance * length;

          const nextZ =
            npc.z + dz / distance * length;

          const nextY = surfaceHeight(
            npc.locationId,
            nextX,
            nextZ
          );

          const playerDistance = Math.hypot(
            nextX - state.player.x,
            nextZ - state.player.z
          );

          const playerY = surfaceHeight(
            state.locationId,
            state.player.x,
            state.player.z
          );

          const blockedByPlayer =
            playerDistance <
              PLAYER_RADIUS + npc.radius + 0.08 &&
            Math.abs(nextY - playerY) < 1.5;

          if (
            !blockedByPlayer &&
            !hitsStatic(
              npc.locationId,
              nextX,
              nextZ,
              nextY,
              npc.radius
            )
          ) {
            npc.x = nextX;
            npc.z = nextZ;

            npc.model.root.rotation.y =
              Math.atan2(dx, dz);

            npc.mode = "walk";
          } else {
            npc.pause = 0.4;
            npc.mode = "idle";
          }
        }
      }

      const t = npc.animationTime;
      const model = npc.model;

      if (npc.mode === "walk") {
        const swing = Math.sin(t * 9) * 0.52;

        if (model.legs.length) {
          model.legs[0].rotation.x = swing;
          model.legs[1].rotation.x = -swing;
        }

        if (model.arms.length) {
          model.arms[0].rotation.x =
            -swing * 0.65;

          model.arms[1].rotation.x =
            swing * 0.65;
        }

        model.body.position.y =
          Math.abs(Math.sin(t * 9)) * 0.055;
      } else if (npc.mode === "talk") {
        if (model.legs.length) {
          model.legs[0].rotation.x = 0;
          model.legs[1].rotation.x = 0;
        }

        if (model.arms.length) {
          model.arms[0].rotation.x =
            -0.45 + Math.sin(t * 7) * 0.16;

          model.arms[1].rotation.x =
            -0.26 + Math.sin(t * 5 + 1) * 0.23;
        }

        model.body.position.y =
          Math.sin(t * 5) * 0.035;

        model.body.rotation.z =
          Math.sin(t * 3) * 0.035;
      } else {
        if (model.legs.length) {
          model.legs[0].rotation.x *= 0.82;
          model.legs[1].rotation.x *= 0.82;
        }

        if (model.arms.length) {
          model.arms[0].rotation.x =
            Math.sin(t * 2) * 0.055;

          model.arms[1].rotation.x =
            -Math.sin(t * 2) * 0.055;
        }

        model.body.position.y =
          Math.sin(t * 2.1) * 0.025;

        model.body.rotation.z =
          Math.sin(t * 1.3) * 0.018;
      }

      if (model.tail) {
        model.tail.rotation.z =
          Math.sin(t * (
            npc.mode === "talk" ? 7 : 3
          )) * 0.18;
      }

      model.root.position.set(
        npc.x,
        surfaceHeight(
          npc.locationId,
          npc.x,
          npc.z
        ),
        npc.z
      );
    }

    /*

    function register({
      locationId,
      position,
      label,
      run,
      radius = 3.1,
      kind = "object"
    }) {
      interactables.push({
        locationId,
        position,
        label,
        run,
        radius,
        kind
      });

    function staticPosition(x, z) {

    function npcPosition(npc) {

    function distanceTo(x, z) {
      return Math.hypot(
        state.player.x - x,
        state.player.z - z
      );
    }

    function nearestInteraction() {
      let nearest = null;
      let bestDistance = Infinity;

      for (const target of interactables) {
        if (
          target.locationId !==
          state.locationId
        ) {
          continue;
        }

        const point = target.position();
        const distance = distanceTo(
          point.x,
          point.z
        );

        if (
          distance < target.radius &&
          distance < bestDistance
        ) {
          nearest = target;
          bestDistance = distance;
        }
      }

      return nearest;
    }

    register({
      locationId: "forest",
      position: npcPosition(fox),
      label: "Поговорить с Лисёнком",
      kind: "npc",
      radius: 2.8,
      run: () => {
        if (state.flags.foxTradeDone) {
          showModal(
            "Лисёнок",
            "Фонарь теперь твой. Его света хватит для праздничной ёлки!",
            [],
            "fox"
          );

          return;
        }

        if (!hasItem("cookie")) {
          showModal(
            "Лисёнок",
            "У меня есть фонарь. Я бы с радостью обменял его на печенье!",
            [],
            "fox"
          );

          return;
        }

        showModal(
          "Лисёнок",
          "Как вкусно пахнет печенье! Обменяешь его на мой фонарь?",
          [
            {
              label:
                "Обменять печенье на фонарь",
              run: () => {
                removeItem("cookie");
                addItem("lantern");

                state.flags.foxTradeDone =
                  true;

                changed();
                closeModal();

                toast(
                  "Получен фонарь. Используй его у праздничной ёлки."
                );
              }
            },
            {
              label:
                "Оставить печенье себе",
              run: closeModal
            }
          ],
          "fox"
        );
      }
    });

    register({
      locationId: "forest",
      position: staticPosition(3, -5),
      label: "Осмотреть праздничную ёлку",
      radius: 3.2,
      run: () => {
        showModal(
          "Праздничная ёлка",
          state.flags.treeLit
            ? "Фонарь уже горит. Лес стал заметно уютнее!"
            : "Выбери фонарь в инвентаре и нажми F рядом с ёлкой."
        );
      }
    });

    register({
      locationId: "square",
      position: staticPosition(
        mailboxX,
        mailboxZ
      ),
      label: "Открыть почтовый ящик",
      radius: 2.7,
      run: () => {
        const missing = [];

        if (
          !state.flags.giftDelivered ||
          !hasItem("star")
        ) {
          missing.push(
            "вручить подарок Бабушке"
          );
        }

        if (!state.flags.treeLit) {
          missing.push(
            "зажечь ёлку в Лесу"
          );
        }

        if (missing.length) {
          showModal(
            "Почтовый ящик",
            `До финала осталось:\n• ${
              missing.join("\n• ")
            }`
          );

          return;
        }

        state.flags.completed = true;
        changed();

        showModal(
          state.stats.anonymity >= 2
            ? "Финал: тайна Деда Мороза"
            : "Финал: тёплый праздник",
          state.stats.anonymity >= 2
            ? "Все получили немного тепла, а имя дарителя осталось тайной. Настоящий анонимный Дед Мороз!"
            : "Подарок доставлен, ёлка сияет. Пусть тебя и узнали, добрый поступок сделал праздник ярче."
        );
      }
    });

    // ================================================================
    // 9. ИГРОК, ЛОКАЦИИ, ИСПОЛЬЗОВАНИЕ ПРЕДМЕТОВ
    // ================================================================

    const player = makeSanta();

    scene.add(player.root);

    function applyLocation(snapCamera = false) {
      for (const [id, group] of
        Object.entries(locationGroups)) {
        group.visible =
          id === state.locationId;
      }

      const color =
        LOCATIONS[state.locationId].sky;

      scene.background.setHex(color);
      scene.fog.color.setHex(color);

      const height = surfaceHeight(
        state.locationId,
        state.player.x,
        state.player.z
      );

      player.root.position.set(
        LOCATIONS[state.locationId].baseX +
          state.player.x,
        height,
        state.player.z
      );

      if (snapCamera) {
        camera.position.copy(
          player.root.position
        ).add(
          new THREE.Vector3(
            0,
            10.8,
            15
          )
        );

        camera.lookAt(
          player.root.position.x,
          player.root.position.y + 1,
          player.root.position.z
        );
      }

      prompt.textContent = "";
    }

    function useSelectedItem() {
      const id =
        state.inventory[
          state.selectedSlot
        ];

      if (!id) {
        toast(
          "Выбранная ячейка пуста."
        );

        return;
      }

      if (
        id === "gift" &&
        state.locationId === "workshop" &&
        distanceTo(1, -3) < 3
      ) {
        if (!hasItem("ribbon")) {
          toast(
            "Для упаковки нужна лента. Поговори с Эльфом."
          );

          return;
        }

        state.inventory[
          state.selectedSlot
        ] = "wrappedGift";

        removeItem("ribbon");
        changed();

        toast(
          "Подарок упакован! Отнеси его Бабушке."
        );

        return;
      }

      if (
        id === "lantern" &&
        state.locationId === "forest" &&
        distanceTo(3, -5) < 3.2
      ) {
        if (state.flags.treeLit) {
          toast(
            "Ёлка уже освещена."
          );

          return;
        }

        removeItem("lantern");

        state.flags.treeLit = true;

        state.stats.warmth =
          Math.min(
            100,
            state.stats.warmth + 2
          );

        syncTree();
        changed();

        toast(
          "Ёлка сияет! Вернись к почтовому ящику."
        );

        return;
      }

      const hints = {
        gift:
          "Подарок можно упаковать на столе в Мастерской.",
        cookie:
          "Печенье можно предложить Лисёнку через диалог.",
        ribbon:
          "Лента пригодится вместе с подарком у упаковочного стола.",
        wrappedGift:
          "Упакованный подарок ждёт Бабушка на площади.",
        lantern:
          "Фонарь можно установить возле праздничной ёлки в Лесу.",
        star:
          "Звезда понадобится у почтового ящика на площади."
      };

      toast(hints[id]);
    }

    /*
     * Если сохранение создано в старой точке, занятой препятствием,
     * переносим персонажа в безопасное место.
     */
    const savedHeight = surfaceHeight(
      state.locationId,
      state.player.x,
      state.player.z
    );

    if (
      hitsStatic(
        state.locationId,
        state.player.x,
        state.player.z,
        savedHeight
      ) ||
      hitsNpc(
        state.locationId,
        state.player.x,
        state.player.z,
        savedHeight
      )
    ) {
      state.player.x = 0;
      state.player.z = 12;
      save();
    }

    applyLocation(true);
    syncTree();
    updateHud();

    // ================================================================
    // 10. МИНИ-КАРТА
    // ================================================================

    const mapCanvas = $("minimap");
    const map = mapCanvas.getContext("2d");

    function mapPoint(x, z) {
      return {
        x:
          (x + HALF_WORLD) /
          (HALF_WORLD * 2) * 160,

        y:
          (z + HALF_WORLD) /
          (HALF_WORLD * 2) * 160
      };
    }

    function drawMap() {
      map.clearRect(
        0,
        0,
        160,
        160
      );

      map.fillStyle =
        state.locationId === "forest"
          ? "#315c58"
          : state.locationId === "workshop"
            ? "#765b48"
            : "#638faa";

      map.fillRect(
        0,
        0,
        160,
        160
      );

      // Площадка мастерской отмечена отдельно.
      if (
        state.locationId ===
        "workshop"
      ) {
        const start = mapPoint(7, 6);
        const end = mapPoint(15, 15);

        map.fillStyle =
          "#bd945f";

        map.fillRect(
          start.x,
          start.y,
          end.x - start.x,
          end.y - start.y
        );
      }

      for (const collider of
        colliders[state.locationId]) {
        if (
          collider.tag === "portal"
        ) {
          continue;
        }

        const point = mapPoint(
          collider.x,
          collider.z
        );

        map.fillStyle =
          collider.tag === "tree"
            ? "#204d45"
            : collider.tag ===
                "mountain"
              ? "#465a68"
              : "#546675";

        if (
          collider.type === "circle"
        ) {
          map.beginPath();

          map.arc(
            point.x,
            point.y,
            Math.max(
              2,
              collider.radius *
                160 / 44
            ),
            0,
            Math.PI * 2
          );

          map.fill();
        } else {
          map.fillRect(
            point.x -
              collider.hx *
                160 / 44,
            point.y -
              collider.hz *
                160 / 44,
            collider.hx *
              2 * 160 / 44,
            collider.hz *
              2 * 160 / 44
          );
        }
      }

      for (const target of
        interactables) {
        if (
          target.locationId !==
          state.locationId
        ) {
          continue;
        }

        const position =
          target.position();

        const point = mapPoint(
          position.x,
          position.z
        );

        map.fillStyle =
          target.kind === "portal"
            ? "#91e5ff"
            : target.kind === "npc"
              ? "#ffc0a3"
              : "#ffffff";

        map.beginPath();

        map.arc(
          point.x,
          point.y,
          target.kind === "portal"
            ? 4
            : 3,
          0,
          Math.PI * 2
        );

        map.fill();
      }

      const playerPoint =
        mapPoint(
          state.player.x,
          state.player.z
        );

      map.fillStyle =
        "#ffdf78";

      map.beginPath();

      map.arc(
        playerPoint.x,
        playerPoint.y,
        4.5,
        0,
        Math.PI * 2
      );

      map.fill();

      map.strokeStyle =
        "rgba(255,255,255,.5)";

      map.strokeRect(
        0.5,
        0.5,
        159,
        159
      );
    }

    // ================================================================
    // 11. ЗАГЛУШКА ФОНОВОГО ЭМБИЕНТА
    // ================================================================

    /*
     * Вместо внешнего mp3: мягкий синтезированный аккорд.
     * Запускается ТОЛЬКО после нажатия пользователем.
     * Для релизной версии этот модуль можно заменить загрузкой
     * подготовленного аудиофайла, сохранив кнопку и API.
     */

    let audioContext = null;
    let ambientNodes = [];
    let musicOn = false;

    async function startAmbient() {
      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        toast(
          "Этот браузер не поддерживает Web Audio."
        );

        return;
      }

      try {
        audioContext =
          new AudioContextClass();

        await audioContext.resume();

        const master =
          audioContext.createGain();

        master.gain.value = 0.0001;
        master.connect(
          audioContext.destination
        );

        // Низкая громкость и длинное нарастание.
        master.gain.exponentialRampToValueAtTime(
          0.026,
          audioContext.currentTime + 2
        );

        const notes = [
          130.81,
          164.81,
          196.0,
          261.63
        ];

        for (const frequency of notes) {
          const oscillator =
            audioContext.createOscillator();

          const voiceGain =
            audioContext.createGain();

          oscillator.type = "sine";

          oscillator.frequency.value =
            frequency;

          voiceGain.gain.value =
            0.18;

          oscillator.connect(
            voiceGain
          );

          voiceGain.connect(
            master
          );

          oscillator.start();

          ambientNodes.push(
            oscillator
          );
        }

        ambientNodes.push(master);

        musicOn = true;

        $("musicButton").textContent =
          "♫ Выключить эмбиент";

        $("musicButton").setAttribute(
          "aria-pressed",
          "true"
        );

        toast(
          "Синтезированный эмбиент включён."
        );
      } catch {
        musicOn = false;

        toast(
          "Не удалось запустить звук."
        );
      }
    }

    async function stopAmbient() {
      if (!audioContext) return;

      try {
        await audioContext.close();
      } catch {
        // Закрытие звука не влияет на игровой процесс.
      }

      audioContext = null;
      ambientNodes = [];
      musicOn = false;

      $("musicButton").textContent =
        "♫ Включить эмбиент";

      $("musicButton").setAttribute(
        "aria-pressed",
        "false"
      );
    }

    $("musicButton").addEventListener(
      "click",
      () => {
        if (musicOn) {
          stopAmbient();
        } else {
          startAmbient();
        }
      }
    );

    // ================================================================
    // 12. ВВОД
    // ================================================================

    const keys = new Set();

    addEventListener(
      "keydown",
      event => {
        if (
          [
            "KeyW",
            "KeyA",
            "KeyS",
            "KeyD",
            "KeyE",
            "KeyF",
            "Digit1",
            "Digit2",
            "Digit3",
            "Digit4",
            "Escape"
          ].includes(event.code)
        ) {
          event.preventDefault();
        }

        if (
          event.code === "Escape" &&
          !overlay.hidden
        ) {
          closeModal();

          return;
        }

        if (!overlay.hidden) {
          return;
        }

        if (
          [
            "KeyW",
            "KeyA",
            "KeyS",
            "KeyD"
          ].includes(event.code)
        ) {
          keys.add(event.code);
        }

        if (event.repeat) return;

        if (
          event.code === "KeyE"
        ) {
          nearestInteraction()?.run();
        }

        if (
          event.code === "KeyF"
        ) {
          useSelectedItem();
        }

        const match =
          /^Digit([1-4])$/.exec(
            event.code
          );

        if (match) {
          state.selectedSlot =
            Number(match[1]) - 1;

          changed();
        }
      }
    );

    addEventListener(
      "keyup",
      event => {
        keys.delete(event.code);
      }
    );

    addEventListener(
      "blur",
      () => {
        keys.clear();
      }
    );

    addEventListener(
      "resize",
      () => {
        camera.aspect =
          innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          innerWidth,
          innerHeight
        );

        renderer.setPixelRatio(
          Math.min(
            devicePixelRatio,
            1.5
          )
        );
      }
    );

    // ================================================================
    // 13. ОБНОВЛЕНИЕ ПАРТИКЛОВ
    // ================================================================

    const reducedMotion =
      matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

    function updateParticles(
      dt,
      elapsed
    ) {
      for (const system of
        particleSystems) {
        if (
          system.locationId !==
          state.locationId
        ) {
          continue;
        }

        const attribute =
          system.points.geometry
            .attributes.position;

        for (
          let i = 0;
          i < attribute.count;
          i++
        ) {
          let x =
            attribute.getX(i);

          let y =
            attribute.getY(i);

          let z =
            attribute.getZ(i);

          const speedMultiplier =
            reducedMotion
              ? 0.3
              : 1;

          if (
            system.type ===
            "snow"
          ) {
            y -=
              dt *
              system.speeds[i] *
              speedMultiplier;

            x +=
              Math.sin(
                elapsed * 0.8 +
                i
              ) *
              dt *
              0.1 *
              speedMultiplier;

            if (y < 0.1) {
              y = 10;
            }
          } else {
            y +=
              Math.sin(
                elapsed * 2.2 +
                i
              ) *
              dt *
              0.18 *
              speedMultiplier;

            x +=
              Math.cos(
                elapsed + i
              ) *
              dt *
              0.1 *
              speedMultiplier;
          }

          attribute.setXYZ(
            i,
            x,
            y,
            z
          );
        }

        attribute.needsUpdate =
          true;
      }
    }

    // ================================================================
    // 14. ГЛАВНЫЙ ЦИКЛ
    // ================================================================

    const clock =
      new THREE.Clock();

    let elapsed = 0;
    let saveTimer = 0;
    let mapTimer = 0;

    function frame() {
      requestAnimationFrame(
        frame
      );

      const dt = Math.min(
        clock.getDelta(),
        0.05
      );

      elapsed += dt;

      let dx = 0;
      let dz = 0;

      if (
        overlay.hidden
      ) {
        if (
          keys.has("KeyA")
        ) dx -= 1;

        if (
          keys.has("KeyD")
        ) dx += 1;

        if (
          keys.has("KeyW")
        ) dz -= 1;

        if (
          keys.has("KeyS")
        ) dz += 1;
      }

      const moving =
        dx !== 0 ||
        dz !== 0;

      if (moving) {
        const length =
          Math.hypot(
            dx,
            dz
          );

        dx /= length;
        dz /= length;

        movePlayer(
          dx *
            PLAYER_SPEED *
            dt,

          dz *
            PLAYER_SPEED *
            dt
        );

        player.root.rotation.y =
          Math.atan2(
            dx,
            dz
          );

        saveTimer += dt;

        if (
          saveTimer > 1
        ) {
          save();
          saveTimer = 0;
        }
      }

      const playerHeight =
        surfaceHeight(
          state.locationId,
          state.player.x,
          state.player.z
        );

      player.root.position.set(
        LOCATIONS[
          state.locationId
        ].baseX +
          state.player.x,

        playerHeight,

        state.player.z
      );

      const swing =
        moving
          ? Math.sin(
              elapsed * 10
            ) * 0.55
          : 0;

      player.legs[0].rotation.x =
        swing;

      player.legs[1].rotation.x =
        -swing;

      player.arms[0].rotation.x =
        -swing * 0.7;

      player.arms[1].rotation.x =
        swing * 0.7;

      player.body.position.y =
        moving
          ? Math.abs(
              Math.sin(
                elapsed * 10
              )
            ) * 0.055
          : Math.sin(
              elapsed * 2.2
            ) * 0.025;

      for (
        const npc of npcs
      ) {
        updateNpc(
          npc,
          dt,
          elapsed
        );
      }

      for (
        const item of animated
      ) {
        if (
          item.type ===
          "portal"
        ) {
          item.mesh.rotation.y +=
            dt * 0.68;

          item.mesh.material
            .emissiveIntensity =
            0.5 +
            Math.sin(
              elapsed * 2.5
            ) * 0.2;
        }
      }

      updateParticles(
        dt,
        elapsed
      );

      const target =
        player.root.position
          .clone();

      const cameraGoal =
        target
          .clone()
          .add(
            new THREE.Vector3(
              0,
              10.8,
              15
            )
          );

      camera.position.lerp(
        cameraGoal,
        Math.min(
          1,
          dt * 5.5
        )
      );

      camera.lookAt(
        target.x,
        target.y + 1,
        target.z
      );

      sun.position.set(
        target.x + 9,
        18,
        target.z + 11
      );

      sun.target.position.set(
        target.x,
        target.y,
        target.z
      );

      sun.target.updateMatrixWorld();

      if (
        overlay.hidden
      ) {
        const nearest =
          nearestInteraction();

        prompt.textContent =
          nearest
            ? `E — ${nearest.label}`
            : "";
      } else {
        prompt.textContent =
          "";
      }

      mapTimer += dt;

      if (
        mapTimer > 0.12
      ) {
        drawMap();
        mapTimer = 0;
      }

      renderer.render(
        scene,
        camera
      );
    }

    drawMap();
    frame();
  </script>
</body>
</html>
