server {
    server_name mtg-adm.ru;

    root /var/www/adm/current;
    index index.html;

    server_tokens off;
    autoindex off;

    access_log /var/log/nginx/mtg-adm.access.log;
    error_log /var/log/nginx/mtg-adm.error.log;

    include snippets/adm-csp.conf;
    include snippets/adm-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /CREDITS.md {
        include snippets/adm-headers.conf;
        default_type text/plain;
        charset utf-8;
    }

    location ~* \.(md|map|bat|sh|ts|yml|yaml|env)$ {
        deny all;
    }

    # Staging для автора: отдельные релизы, Basic Auth.
    location ^~ /staging/ {
        auth_basic "ADM staging";
        auth_basic_user_file /etc/nginx/adm-staging.htpasswd;
        alias /var/www/adm/staging/;
        include snippets/adm-csp.conf;
        index index.html;
        include snippets/adm-headers.conf;
        add_header Cache-Control "no-cache" always;
        location ~* \.(md|map|ts|sh)$ { deny all; }
    }

    location ~* \.(js|css|woff2|ktx2|glb|webp|ogg|mp3|png|jpg|svg)$ {
        include snippets/adm-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include snippets/adm-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mtg-adm.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mtg-adm.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mtg-adm.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_tokens off;

    listen 80;
    listen [::]:80;
    server_name mtg-adm.ru;
    return 404; # managed by Certbot


}
